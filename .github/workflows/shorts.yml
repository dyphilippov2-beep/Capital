# Автопилот шортсов: нарезка популярных видео канала и публикация по расписанию.
# Настройка (ключи и ссылки): shorts/README.md, раздел «Автозапуск на GitHub».
name: Shorts autopilot

on:
  schedule:
    # Время в UTC. Для часового пояса UTC+5: публикация в 10:00 и 19:00.
    - cron: "0 5 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "Что сделать"
        type: choice
        options: [post, prepare, top, status]
        default: post

permissions:
  contents: write

concurrency:
  group: shorts-autopilot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      AUTO_CLOUD: "1"
      AUTO_STATE: shorts/state/auto_state.json
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      VK_TOKEN: ${{ secrets.VK_TOKEN }}
      RUTUBE_LOGIN: ${{ secrets.RUTUBE_LOGIN }}
      RUTUBE_PASSWORD: ${{ secrets.RUTUBE_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
      TELEGRAM_CHANNEL: ${{ vars.TELEGRAM_CHANNEL || '@titanhockeylab' }}
      YOUTUBE_CHANNEL: ${{ vars.YOUTUBE_CHANNEL || 'https://www.youtube.com/channel/UC8p1uw85dvpBvRMxBbYFF1A' }}
      PUBLISH_TO: ${{ vars.PUBLISH_TO || 'telegram' }}
      VK_GROUP_ID: ${{ vars.VK_GROUP_ID }}
      YOUTUBE_PRIVACY: ${{ vars.YOUTUBE_PRIVACY || 'public' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: shorts/requirements.txt

      # yt-dlp нужен JavaScript-движок, чтобы разбирать страницы YouTube
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install ffmpeg and fonts
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-liberation

      - name: Install Python packages
        run: pip install -r shorts/requirements.txt

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small

      - name: Write secret files
        env:
          YTDLP_COOKIES_TXT: ${{ secrets.YTDLP_COOKIES }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          if [ -n "$YTDLP_COOKIES_TXT" ]; then
            printf '%s\n' "$YTDLP_COOKIES_TXT" > "$RUNNER_TEMP/cookies.txt"
            echo "YTDLP_COOKIES=$RUNNER_TEMP/cookies.txt" >> "$GITHUB_ENV"
          fi
          if [ -n "$YOUTUBE_TOKEN_JSON" ]; then
            printf '%s\n' "$YOUTUBE_TOKEN_JSON" > shorts/youtube_token.json
          fi

      - name: Run autopilot
        run: |
          CMD="${{ github.event.inputs.command || 'post' }}"
          if [ "$CMD" = "post" ]; then
            python shorts/auto.py post --prepare-if-empty
          else
            python shorts/auto.py "$CMD"
          fi
          python shorts/auto.py status

      - name: Save queue to repository
        if: always()
        run: |
          git config user.name "shorts-autopilot"
          git config user.email "shorts-autopilot@users.noreply.github.com"
          git add shorts/state/auto_state.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Shorts autopilot: update queue"
          git pull --rebase -q && git push
